[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoberblue"
version = "0.1.0"
description = "OctoberBlue: red/blue adversarial evaluation of AI agents with an independent verifier."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["cryptography>=46,<47"]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.scripts]
octoberblue = "octoberblue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/assets/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["octoberblue"]

[tool.setuptools.package-data]
octoberblue = ["fixtures/*.json"]
