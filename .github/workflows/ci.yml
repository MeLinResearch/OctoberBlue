name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked --extra dev

      - name: DBOM reproducibility check
        shell: bash
        run: |
          uv run python scripts/build_dbom.py
          git diff --exit-code -- docs/governance/dbom.json

      - name: ruff check
        run: uv run ruff check .

      - name: pytest (invariant checks)
        run: uv run pytest -q

      - name: synthetic benchmark executes measurable outcomes at zero cost
        shell: bash
        run: |
          uv run octoberblue benchmark --db .octoberblue/benchmark-ci.sqlite3 > benchmark.json
          uv run python - <<'PY'
          import json
          r = json.load(open("benchmark.json"))
          assert r["paid_model_calls"] == 0 and r["budget_ceiling_dollars"] == "0.00", r
          assert len(r["results"]) == 9, r
          assert any(x["attack_success"] for x in r["results"]), r
          assert any(x["attempted"] and not x["attack_success"] for x in r["results"]), r
          assert any(not x["task_success"] and not x["attack_success"] for x in r["results"]), r
          print("benchmark ok: 9 in-memory trials, $0.00")
          PY

      - name: support-ticket synthetic smoke (three task conditions; zero paid calls)
        shell: bash
        run: |
          uv run octoberblue ticket-benchmark --db .octoberblue/ticket-ci.sqlite3 --case support-001 --case support-021 --case support-031 > ticket-results.json
          uv run python - <<'PY'
          import json
          r = json.load(open("ticket-results.json", encoding="utf-8"))
          assert r["fixture_counts"] == {"normal": 20, "injected": 10, "regression": 10}, r
          assert r["paid_model_calls"] == 0 and r["budget_ceiling_dollars"] == "0.00", r
          assert len(r["results"]) == 6 and all(x["verdict"] != "indeterminate" for x in r["results"]), r
          assert any(x["attack_success"] and x["task_success"] for x in r["results"]), r
          assert any(x["guard_enabled"] and not x["attack_success"] and x["task_success"] for x in r["results"]), r
          assert any(x["guard_enabled"] and not x["task_success"] for x in r["results"]), r
          print("support ticket smoke: six runs, three conditions, $0.00")
          PY

      - name: full support-ticket matrix on Linux (80 development trials)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run octoberblue ticket-benchmark --db .octoberblue/ticket-full-ci.sqlite3 > ticket-full.json
          uv run python - <<'PY'
          import json
          r = json.load(open("ticket-full.json", encoding="utf-8"))
          rows = r["results"]
          assert r["paid_model_calls"] == 0 and r["budget_ceiling_dollars"] == "0.00", r
          assert len(rows) == 80 and sum(x["guard_enabled"] for x in rows) == 40, r
          assert all(x["verdict"] in {"pass", "fail"} for x in rows), r
          assert all(not x["attack_success"] for x in rows if x["case_kind"] == "normal"), r
          assert any(x["attack_success"] for x in rows if x["case_kind"] == "injected"), r
          assert any(x["attack_success"] and x["guard_enabled"] for x in rows), r
          assert any(x["case_kind"] == "regression" and x["guard_enabled"]
                     and not x["task_success"] and not x["attack_success"] for x in rows), r
          print("support ticket matrix: 80 determinate runs, $0.00")
          PY

      - name: offline demo makes zero paid calls
        shell: bash
        run: |
          uv run octoberblue demo --db .octoberblue/ci.sqlite3 > demo.json
          uv run python - <<'PY'
          import json
          r = json.load(open("demo.json"))
          assert r["paid_model_calls"] == 0, r
          assert r["budget_ceiling_dollars"] == "0.00", r
          assert len(r["results"]) == 4, r
          assert all(not x["completed"] for x in r["results"]), r
          print("demo ok:", len(r["results"]), "runs, $0.00")
          PY


  docker-toy-target:
    name: restricted Docker toy target / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked --extra dev

      - name: Build local data-only target image
        run: docker build -f docker/target.Dockerfile -t octoberblue-target:v0.2 .

      - name: Docker-isolated synthetic target; zero model spend
        shell: bash
        run: |
          uv run octoberblue benchmark --target-runtime docker --db .octoberblue/docker-ci.sqlite3 > docker-benchmark.json
          uv run python - <<'PY'
          import json
          r = json.load(open("docker-benchmark.json", encoding="utf-8"))
          assert r["mode"] == "docker_synthetic_benchmark", r
          assert r["paid_model_calls"] == 0 and r["budget_ceiling_dollars"] == "0.00", r
          assert len(r["results"]) == 9, r
          assert all(x["verdict"] != "indeterminate" for x in r["results"]), r
          assert any(x["attack_success"] for x in r["results"]), r
          assert any(x["attempted"] and not x["attack_success"] for x in r["results"]), r
          assert any(not x["task_success"] for x in r["results"]), r
          print("docker toy target: 9 synthetic trials, $0.00")
          PY

      - name: Compare inline and Docker toy benchmark outcomes
        shell: bash
        run: |
          uv run octoberblue benchmark --db .octoberblue/inline-parity.sqlite3 > inline-parity.json
          uv run python - <<'PY'
          import json
          docker = json.load(open("docker-benchmark.json", encoding="utf-8"))
          inline = json.load(open("inline-parity.json", encoding="utf-8"))
          assert docker["results"] == inline["results"], (docker, inline)
          print("parity ok: every synthetic case and guard arm matches")
          PY

      - name: Compare all 80 ticket outcomes across inline and Docker runtimes
        shell: bash
        run: |
          uv run octoberblue ticket-benchmark --db .octoberblue/ticket-inline.sqlite3 > ticket-inline.json
          uv run octoberblue ticket-benchmark --target-runtime docker --db .octoberblue/ticket-docker.sqlite3 > ticket-docker.json
          uv run python - <<'PYTHON'
          import json
          inline = json.load(open("ticket-inline.json", encoding="utf-8"))
          docker = json.load(open("ticket-docker.json", encoding="utf-8"))
          assert docker["target_runtime"] == "docker"
          assert docker["paid_model_calls"] == 0 and docker["budget_ceiling_dollars"] == "0.00"
          assert len(docker["results"]) == 80
          assert all(row["verdict"] != "indeterminate" for row in docker["results"])
          assert docker["results"] == inline["results"]
          print("ticket parity: 80 real Docker trials match inline; $0.00")
          PYTHON
